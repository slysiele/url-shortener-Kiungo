# Serves the Angular app and forwards API calls to the backend.
# Short links live on their own domain (APP_BASE_URL) which points straight at the backend.
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location /api/          { proxy_pass http://backend:8080; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
  location /swagger-ui    { proxy_pass http://backend:8080; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
  location /v3/api-docs   { proxy_pass http://backend:8080; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }

  # Long cache for fingerprinted assets, none for index.html
  location ~* \.(js|css|woff2?|svg|png|ico)$ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
  location / { add_header Cache-Control "no-cache"; try_files $uri $uri/ /index.html; }
}
