# Full stack locally: http://localhost:4200 (app) and http://localhost:8080 (short links + API)
#   docker compose up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kiungo
      POSTGRES_USER: kiungo
      POSTGRES_PASSWORD: kiungo
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kiungo"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://db:5432/kiungo
      DATABASE_USERNAME: kiungo
      DATABASE_PASSWORD: kiungo
      APP_BASE_URL: http://localhost:8080
      APP_FRONTEND_URL: http://localhost:4200
      APP_CORS_ORIGINS: http://localhost:4200
      JWT_SECRET: local-docker-secret-change-me-0123456789abcdef
      BILLING_MODE: mock
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    depends_on: [backend]
    ports:
      - "4200:80"

volumes:
  pgdata:
